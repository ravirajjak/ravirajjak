<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="stack-title stack-desc">
<title id="stack-title">Tech stack: Kotlin, Java, Jetpack Compose, Spring Boot, PostgreSQL, Docker, and more.</title>
<desc id="stack-desc">Animated tech stack visualization with orbiting technology labels</desc>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-weight:700;fill:#e8f0fe}
.mono{font-family:'Courier New','SF Mono',monospace;font-weight:400}
.green{fill:#3DDC84}.blue{fill:#1a73e8}.teal{fill:#00BCD4}.muted{fill:#7a8ba5}
.enter{animation:entry 1s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
.d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}
.d7{animation-delay:.7s}
.pulse{animation:pulse 2.4s ease-in-out infinite both}
.float{animation:float 5s ease-in-out infinite both}
.scan{animation:scan 10s ease-in-out infinite both}
@keyframes entry{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes scan{0%,20%{transform:translateX(-1200px)}80%,100%{transform:translateX(1200px)}}
@keyframes orbit1{from{transform:rotate(0deg) translateX(130px) rotate(0deg)}to{transform:rotate(360deg) translateX(130px) rotate(-360deg)}}
@keyframes orbit2{from{transform:rotate(0deg) translateX(130px) rotate(0deg)}to{transform:rotate(-360deg) translateX(130px) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="st-border" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#3DDC84" stop-opacity=".5"/>
    <stop offset=".5" stop-color="#1a73e8" stop-opacity=".2"/>
    <stop offset="1" stop-color="#00BCD4" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="st-foil">
    <stop stop-color="#3DDC84" stop-opacity="0"/>
    <stop offset=".45" stop-color="#3DDC84" stop-opacity="0"/>
    <stop offset=".5" stop-color="#afffcc" stop-opacity=".12"/>
    <stop offset=".55" stop-color="#1a73e8" stop-opacity=".06"/>
    <stop offset="1" stop-color="#1a73e8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="st-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r=".6" fill="#3DDC84" opacity=".06"/>
  </pattern>
  <filter id="st-glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <clipPath id="st-clip"><rect x="1" y="1" width="1198" height="578" rx="24"/></clipPath>
</defs>

<g clip-path="url(#st-clip)">
  <rect x="1" y="1" width="1198" height="578" rx="24" fill="#0a1628" stroke="url(#st-border)" stroke-width="1"/>
  <rect x="2" y="2" width="1196" height="576" rx="23" fill="url(#st-dots)"/>
  <rect x="0" y="0" width="1200" height="580" fill="url(#st-foil)" class="scan"/>

  <!-- Section label -->
  <text x="48" y="48" font-size="11" letter-spacing="2.5" class="mono muted enter d1">// TECH STACK</text>

  <!-- Headline -->
  <text x="48" y="95" font-size="36" class="enter d2">Tools I</text>
  <text x="200" y="95" font-size="36" class="enter d2 green"> Build With</text>

  <!-- Column 1: Languages -->
  <g class="enter d3" transform="translate(48,130)">
    <text x="0" y="16" font-size="12" letter-spacing="1.5" class="mono green">LANGUAGES</text>
    <line x1="0" y1="26" x2="120" y2="26" stroke="#3DDC84" stroke-opacity=".3"/>

    <g transform="translate(0,45)">
      <rect width="230" height="38" rx="8" fill="#0f2440" stroke="#3DDC84" stroke-opacity=".2"/>
      <rect x="6" y="6" width="26" height="26" rx="6" fill="#1a2f18"/>
      <text x="14" y="24" font-size="13" text-anchor="middle" class="green">K</text>
      <text x="42" y="19" font-size="13" fill="#e8f0fe">Kotlin</text>
      <text x="42" y="32" font-size="9" class="mono muted">Primary · Android + Backend</text>
    </g>
    <g transform="translate(0,92)">
      <rect width="230" height="38" rx="8" fill="#0f2440" stroke="#1a73e8" stroke-opacity=".2"/>
      <rect x="6" y="6" width="26" height="26" rx="6" fill="#0c1e3d"/>
      <text x="14" y="24" font-size="13" text-anchor="middle" class="blue">J</text>
      <text x="42" y="19" font-size="13" fill="#e8f0fe">Java</text>
      <text x="42" y="32" font-size="9" class="mono muted">Enterprise · Spring Boot</text>
    </g>
    <g transform="translate(0,139)">
      <rect width="230" height="38" rx="8" fill="#0f2440" stroke="#00BCD4" stroke-opacity=".2"/>
      <rect x="6" y="6" width="26" height="26" rx="6" fill="#0c2a2c"/>
      <text x="14" y="24" font-size="13" text-anchor="middle" class="teal">Py</text>
      <text x="42" y="19" font-size="13" fill="#e8f0fe">Python</text>
      <text x="42" y="32" font-size="9" class="mono muted">FastAPI · Scripting</text>
    </g>
    <g transform="translate(0,186)">
      <rect width="230" height="38" rx="8" fill="#0f2440" stroke="#7a8ba5" stroke-opacity=".2"/>
      <rect x="6" y="6" width="26" height="26" rx="6" fill="#1a1f2e"/>
      <text x="14" y="24" font-size="13" text-anchor="middle" fill="#7a8ba5">SQ</text>
      <text x="42" y="19" font-size="13" fill="#e8f0fe">SQL</text>
      <text x="42" y="32" font-size="9" class="mono muted">PostgreSQL · MySQL</text>
    </g>
    <g transform="translate(0,233)">
      <rect width="230" height="38" rx="8" fill="#0f2440" stroke="#7a8ba5" stroke-opacity=".2"/>
      <rect x="6" y="6" width="26" height="26" rx="6" fill="#1a1f2e"/>
      <text x="14" y="24" font-size="12" text-anchor="middle" fill="#7a8ba5">C+</text>
      <text x="42" y="19" font-size="13" fill="#e8f0fe">C++</text>
      <text x="42" y="32" font-size="9" class="mono muted">NDK · JNI · Secure Storage</text>
    </g>
  </g>

  <!-- Column 2: Android -->
  <g class="enter d4" transform="translate(320,130)">
    <text x="0" y="16" font-size="12" letter-spacing="1.5" class="mono green">ANDROID</text>
    <line x1="0" y1="26" x2="100" y2="26" stroke="#3DDC84" stroke-opacity=".3"/>

    <g transform="translate(0,45)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#3DDC84" stroke-opacity=".3"/>
      <text x="14" y="25" font-size="12" class="green">★</text>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">Jetpack Compose</text>
      <text x="32" y="32" font-size="9" class="mono muted">Modern declarative UI</text>
    </g>
    <g transform="translate(0,92)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#3DDC84" stroke-opacity=".2"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">MVVM + Clean Arch</text>
      <text x="32" y="32" font-size="9" class="mono muted">Multi-module architecture</text>
    </g>
    <g transform="translate(0,139)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#1a73e8" stroke-opacity=".2"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">Coroutines + Flow</text>
      <text x="32" y="32" font-size="9" class="mono muted">Async · Reactive streams</text>
    </g>
    <g transform="translate(0,186)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#1a73e8" stroke-opacity=".2"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">Room + WorkManager</text>
      <text x="32" y="32" font-size="9" class="mono muted">Offline-first · Sync</text>
    </g>
    <g transform="translate(0,233)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#00BCD4" stroke-opacity=".2"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">ExoPlayer + DRM</text>
      <text x="32" y="32" font-size="9" class="mono muted">OTT · Streaming · Video</text>
    </g>
    <g transform="translate(0,280)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#00BCD4" stroke-opacity=".15"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">KMP / CMP</text>
      <text x="32" y="32" font-size="9" class="mono muted">Kotlin Multiplatform</text>
    </g>
  </g>

  <!-- Column 3: Backend + DevOps -->
  <g class="enter d5" transform="translate(612,130)">
    <text x="0" y="16" font-size="12" letter-spacing="1.5" class="mono blue">BACKEND &amp; DEVOPS</text>
    <line x1="0" y1="26" x2="160" y2="26" stroke="#1a73e8" stroke-opacity=".3"/>

    <g transform="translate(0,45)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#3DDC84" stroke-opacity=".3"/>
      <text x="14" y="25" font-size="12" class="green">★</text>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">Spring Boot</text>
      <text x="32" y="32" font-size="9" class="mono muted">REST APIs · Microservices</text>
    </g>
    <g transform="translate(0,92)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#1a73e8" stroke-opacity=".2"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">FastAPI</text>
      <text x="32" y="32" font-size="9" class="mono muted">Python · High-performance</text>
    </g>
    <g transform="translate(0,139)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#1a73e8" stroke-opacity=".2"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">PostgreSQL · MySQL</text>
      <text x="32" y="32" font-size="9" class="mono muted">Data persistence</text>
    </g>
    <g transform="translate(0,186)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#00BCD4" stroke-opacity=".2"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">Jenkins · CI/CD</text>
      <text x="32" y="32" font-size="9" class="mono muted">Build automation · Pipelines</text>
    </g>
    <g transform="translate(0,233)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#00BCD4" stroke-opacity=".15"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">Firebase · Crashlytics</text>
      <text x="32" y="32" font-size="9" class="mono muted">Analytics · Monitoring</text>
    </g>
    <g transform="translate(0,280)">
      <rect width="250" height="38" rx="8" fill="#0f2440" stroke="#7a8ba5" stroke-opacity=".15"/>
      <text x="32" y="19" font-size="13" fill="#e8f0fe">Docker · K8s · Kafka</text>
      <text x="32" y="32" font-size="9" class="mono muted">Learning · Cloud-native</text>
    </g>
  </g>

  <!-- Column 4: Security & Tools -->
  <g class="enter d6" transform="translate(904,130)">
    <text x="0" y="16" font-size="12" letter-spacing="1.5" class="mono teal">SECURITY &amp; TOOLS</text>
    <line x1="0" y1="26" x2="150" y2="26" stroke="#00BCD4" stroke-opacity=".3"/>

    <g transform="translate(0,45)">
      <rect width="240" height="38" rx="8" fill="#0f2440" stroke="#3DDC84" stroke-opacity=".2"/>
      <text x="16" y="19" font-size="13" fill="#e8f0fe">AES / RSA Encryption</text>
      <text x="16" y="32" font-size="9" class="mono muted">App-level security</text>
    </g>
    <g transform="translate(0,92)">
      <rect width="240" height="38" rx="8" fill="#0f2440" stroke="#1a73e8" stroke-opacity=".2"/>
      <text x="16" y="19" font-size="13" fill="#e8f0fe">SSO · OAuth · SafetyNet</text>
      <text x="16" y="32" font-size="9" class="mono muted">Auth &amp; integrity</text>
    </g>
    <g transform="translate(0,139)">
      <rect width="240" height="38" rx="8" fill="#0f2440" stroke="#00BCD4" stroke-opacity=".2"/>
      <text x="16" y="19" font-size="13" fill="#e8f0fe">SonarQube</text>
      <text x="16" y="32" font-size="9" class="mono muted">Code quality · Static analysis</text>
    </g>
    <g transform="translate(0,186)">
      <rect width="240" height="38" rx="8" fill="#0f2440" stroke="#00BCD4" stroke-opacity=".15"/>
      <text x="16" y="19" font-size="13" fill="#e8f0fe">Hilt · Dagger</text>
      <text x="16" y="32" font-size="9" class="mono muted">Dependency injection</text>
    </g>
    <g transform="translate(0,233)">
      <rect width="240" height="38" rx="8" fill="#0f2440" stroke="#7a8ba5" stroke-opacity=".15"/>
      <text x="16" y="19" font-size="13" fill="#e8f0fe">Git · JIRA · Agile</text>
      <text x="16" y="32" font-size="9" class="mono muted">Process &amp; collaboration</text>
    </g>
    <g transform="translate(0,280)">
      <rect width="240" height="38" rx="8" fill="#0f2440" stroke="#7a8ba5" stroke-opacity=".1"/>
      <text x="16" y="19" font-size="13" fill="#e8f0fe">Claude Code · LLMs</text>
      <text x="16" y="32" font-size="9" class="mono green">Currently exploring</text>
    </g>
  </g>

  <!-- Bottom line -->
  <text x="600" y="555" font-size="11" class="mono muted enter d7" text-anchor="middle" letter-spacing="1">ALWAYS LEARNING · ALWAYS BUILDING</text>
</g>
</svg>